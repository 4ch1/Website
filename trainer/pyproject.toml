[project]
name = "daytrading-trainer"
version = "0.1.0"
description = "Интерактивный тренажёр «угадай, куда пойдёт цена» на реальных интрадей-графиках"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "yfinance>=0.2.50",
    "scipy>=1.13",
    "pydantic>=2.7",
]

[project.optional-dependencies]
figures = ["mplfinance>=0.12.10b0", "matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests", "e2e"]
addopts = "-q"
markers = ["e2e: browser tests (need built frontend)"]

[tool.setuptools]
packages = ["backend"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
